
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101114">
<title>ZAKI AI</title>
<style>
:root{color-scheme:dark;--bg:#101114;--panel:#191a20;--panel2:#24252d;--border:#33343d;--text:#f5f5f7;--muted:#a5a5b0;--accent:#a78bfa;--user:#292a32}
:root[data-theme=light]{color-scheme:light;--bg:#fff;--panel:#f7f7f8;--panel2:#eeeef1;--border:#dedee3;--text:#202127;--muted:#686875;--accent:#7c3aed;--user:#f0eafa}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px system-ui,sans-serif}
button,input,textarea{font:inherit}button{cursor:pointer;color:inherit}
.app{display:flex;min-height:100dvh}
aside{width:265px;flex-shrink:0;background:var(--panel);border-left:1px solid var(--border);padding:14px;display:flex;flex-direction:column;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-size:21px;font-weight:800;padding:8px}
.logo{width:40px;height:40px;border-radius:14px;background:linear-gradient(135deg,#a78bfa,#4f46e5);display:grid;place-items:center;color:white}
button,.field{border:1px solid var(--border);background:var(--panel);border-radius:11px;padding:10px}
.sidebtn,.new{width:100%;text-align:start;background:transparent}
#history{display:grid;gap:5px;overflow:auto}
.hist{display:flex;gap:6px;align-items:center}
.hist button:first-child{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:start;background:transparent;border:0}
.small{padding:6px;font-size:12px}
main{flex:1;min-width:0;display:flex;flex-direction:column;min-height:100dvh}
header{height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid var(--border);gap:8px}
.actions{display:flex;gap:7px}
.content{width:min(850px,100%);margin:auto;flex:1;display:flex;flex-direction:column;padding:18px 20px 8px}
.welcome{text-align:center;margin:auto 0;padding:28px 0}
.biglogo{width:68px;height:68px;border-radius:23px;background:linear-gradient(135deg,#a78bfa,#6366f1);display:grid;place-items:center;font-size:31px;font-weight:900;color:white;margin:0 auto 18px}
h1{font-size:clamp(27px,5vw,38px);margin:0 0 12px}
.muted{color:var(--muted);line-height:1.8}
.suggestions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;max-width:600px;margin:22px auto}
.suggestion{text-align:start;line-height:1.6}
#messages{display:flex;flex-direction:column;gap:23px;padding:18px 0 30px}
.msg{line-height:1.9;overflow-wrap:anywhere;white-space:pre-wrap}
.msg.user{align-self:flex-start;max-width:92%;background:var(--user);border-radius:18px;padding:12px 16px}
.msg.ai{width:100%}
.msg img{display:block;max-width:min(100%,360px);max-height:300px;object-fit:contain;border-radius:12px;margin:8px 0}
.label{font-size:12px;color:var(--muted);margin-bottom:6px}
.composer-wrap{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 20%);padding:12px 0 5px}
.composer{border:1px solid var(--border);background:var(--panel);border-radius:21px;padding:12px}
#prompt{width:100%;resize:vertical;min-height:65px;max-height:180px;background:transparent;color:var(--text);border:0;outline:0;padding:9px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
#send,.primary{background:var(--accent);color:white;border:0;font-weight:700}
#send:disabled{opacity:.5}
#preview{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);padding:5px}
#preview img{width:48px;height:48px;object-fit:cover;border-radius:8px}
.hidden{display:none!important}
#authView{max-width:440px;width:100%;margin:auto;padding:22px;border:1px solid var(--border);border-radius:18px;background:var(--panel)}
.field{width:100%;margin:6px 0 12px;background:var(--bg);color:var(--text)}
.primary{width:100%;margin:5px 0;padding:12px}
.notice{font-size:12px;color:var(--muted);line-height:1.7}
footer{text-align:center;color:var(--muted);font-size:11px;padding:10px}
@media(max-width:700px){aside{display:none}.app.menu aside{display:flex;position:fixed;inset:0 0 0 auto;z-index:5;width:min(85vw,300px);box-shadow:0 0 0 999px #0008}header{padding:0 10px}.content{padding:12px}.suggestions{grid-template-columns:1fr}.welcome{padding:20px 0}}
</style>
</head>
<body>
<div class="app" id="app">
<aside>
 <div class="brand"><div class="logo">Z</div>ZAKI AI</div>
 <button class="new" id="newChat">＋ <span data-ar="محادثة جديدة" data-en="New chat">محادثة جديدة</span></button>
 <button class="sidebtn" id="loginSide">👤 <span data-ar="تسجيل الدخول" data-en="Sign in">تسجيل الدخول</span></button>
 <div class="muted" data-ar="محادثاتك" data-en="Your chats">محادثاتك</div>
 <div id="history"></div>
 <div style="margin-top:auto;display:grid;gap:8px">
  <button class="sidebtn" id="theme">◐ <span data-ar="تغيير المظهر" data-en="Toggle theme">تغيير المظهر</span></button>
  <button class="sidebtn" id="language">🌐 العربية / English</button>
  <button class="sidebtn hidden" id="logout">↪ <span data-ar="تسجيل الخروج" data-en="Sign out">تسجيل الخروج</span></button>
  <div id="account" class="notice"></div>
 </div>
</aside>
<main>
<header>
 <div><button id="menu">☰</button> <b>ZAKI AI</b></div>
 <div class="actions"><button id="themeTop">◐</button><button id="loginTop">👤 <span data-ar="تسجيل الدخول" data-en="Sign in">تسجيل الدخول</span></button></div>
</header>
<section class="content">
 <div id="welcome" class="welcome">
  <div class="biglogo">Z</div><h1 data-ar="أهلًا بك في ZAKI AI" data-en="Welcome to ZAKI AI">أهلًا بك في ZAKI AI</h1>
  <p class="muted" data-ar="اسأل بالعربية أو الإنجليزية أو الفرنسية، ويمكنك إرفاق صورة." data-en="Ask in Arabic, English or French, and attach an image.">اسأل بالعربية أو الإنجليزية أو الفرنسية، ويمكنك إرفاق صورة.</p>
  <div class="suggestions">
   <button class="suggestion" data-ar="علّمني شيئًا جديدًا اليوم" data-en="Teach me something new">🧠 تعلّم شيئًا جديدًا</button>
   <button class="suggestion" data-ar="ساعدني في إنشاء موقع احترافي" data-en="Help me build a website">💻 البرمجة وإنشاء المواقع</button>
   <button class="suggestion" data-ar="علّمني كلمات إنجليزية جديدة" data-en="Teach me new English words">🌍 تعلّم اللغات</button>
   <button class="suggestion" data-ar="اشرح لي درسًا بطريقة سهلة" data-en="Explain a lesson simply">📚 المساعدة في الدراسة</button>
  </div>
 </div>
 <div id="messages" class="hidden"></div>
 <section id="authView" class="hidden">
  <h2 data-ar="حساب ZAKI AI" data-en="ZAKI AI account">حساب ZAKI AI</h2>
  <p class="muted" data-ar="سجّل الدخول لحفظ محادثاتك." data-en="Sign in to save your chats.">سجّل الدخول لحفظ محادثاتك.</p>
  <label data-ar="البريد الإلكتروني" data-en="Email">البريد الإلكتروني</label>
  <input class="field" id="email" type="email" autocomplete="email" placeholder="you@example.com">
  <label data-ar="كلمة المرور" data-en="Password">كلمة المرور</label>
  <input class="field" id="password" type="password" autocomplete="current-password">
  <button class="primary" id="signIn" data-ar="تسجيل الدخول" data-en="Sign in">تسجيل الدخول</button>
  <button id="signUp" class="primary" style="background:var(--panel2);color:var(--text)" data-ar="إنشاء حساب بالبريد" data-en="Create account">إنشاء حساب بالبريد</button>
  <button id="google" class="primary" style="background:white;color:#222">G　Continue with Google</button>
  <button id="back" style="width:100%" data-ar="العودة للمحادثة" data-en="Back to chat">العودة للمحادثة</button>
  <p id="authStatus" class="notice"></p>
 </section>
 <div class="composer-wrap" id="composerWrap">
  <div id="status" class="muted" style="font-size:12px;margin-bottom:8px" data-ar="جاهز للمساعدة" data-en="Ready to help">جاهز للمساعدة</div>
  <div class="composer">
   <div id="preview" class="hidden"></div>
   <textarea id="prompt" rows="2" placeholder="اكتب رسالتك إلى ZAKI AI..."></textarea>
   <div class="row">
    <div class="row"><button id="attach">＋ <span data-ar="إرفاق صورة" data-en="Attach image">إرفاق صورة</span></button><input id="imageInput" type="file" accept="image/jpeg,image/png,image/webp" class="hidden"></div>
    <button id="send" data-ar="إرسال ↑" data-en="Send ↑">إرسال ↑</button>
   </div>
  </div>
  <footer data-ar="قد يخطئ الذكاء الاصطناعي؛ تحقق من المعلومات المهمة." data-en="AI can make mistakes. Check important information.">قد يخطئ الذكاء الاصطناعي؛ تحقق من المعلومات المهمة.</footer>
 </div>
</section>
</main></div>
<script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

// ضع هنا Project URL وPublishable key من Supabase.
// لا تضع Gemini API key أو أي Secret key هنا.
const SUPABASE_URL='https://sklksgvgpbqelnkhlygr.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_MIQNMH-_adzOffyRSYbQeQ_1H_84r5f';
const WORKER_URL='https://zaki-ai.zakiply4647.workers.dev';

const configured=SUPABASE_URL.startsWith('https://')&&!SUPABASE_PUBLISHABLE_KEY.includes('PASTE_');
const db=configured?createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY):null;
const $=id=>document.getElementById(id);
let user=null,lang=localStorage.getItem('zaki-lang')||'ar';
let theme=localStorage.getItem('zaki-theme')||'dark';
let currentId=null,chat=[],historyRows=[],image=null,busy=false;
const tr=(ar,en)=>lang==='ar'?ar:en;

function applyLanguage(){
 document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';
 document.querySelectorAll('[data-ar]').forEach(e=>e.textContent=e.dataset[lang]);
 $('prompt').placeholder=tr('اكتب رسالتك إلى ZAKI AI...','Message ZAKI AI...');
 $('language').textContent=lang==='ar'?'🌐 العربية / English':'🌐 English / العربية';
}
function applyTheme(){document.documentElement.dataset.theme=theme;localStorage.setItem('zaki-theme',theme)}
function showAuth(){
 ['welcome','messages','composerWrap'].forEach(id=>$(id).classList.add('hidden'));
 $('authView').classList.remove('hidden');
 $('authStatus').textContent=configured?'':tr('أكمل إعداد Supabase أولًا.','Finish Supabase setup first.');
}
function showChat(){
 $('authView').classList.add('hidden');$('composerWrap').classList.remove('hidden');
 $('welcome').classList.toggle('hidden',chat.length>0);
 $('messages').classList.toggle('hidden',chat.length===0);
}
function render(){
 const box=$('messages');box.replaceChildren();
 chat.forEach(m=>{
  const el=document.createElement('div');el.className='msg '+(m.role==='user'?'user':'ai');
  if(m.role!=='user'){const label=document.createElement('div');label.className='label';label.textContent='✦ ZAKI AI';el.append(label)}
  const text=document.createElement('div');text.textContent=m.content||'';el.append(text);
  if(m.imageData){const img=document.createElement('img');img.src=m.imageData;el.append(img)}
  if(m.role!=='user'){
   const b=document.createElement('button');b.className='small';b.textContent=tr('نسخ الرد','Copy response');
   b.onclick=()=>navigator.clipboard.writeText(m.content||'');el.append(b);
  }
  box.append(el);
 });
 showChat();window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});
}
function renderHistory(){
 const box=$('history');box.replaceChildren();
 historyRows.forEach(row=>{
  const wrap=document.createElement('div');wrap.className='hist';
  const b=document.createElement('button');b.textContent=row.title||tr('محادثة جديدة','New chat');
  b.onclick=()=>loadChat(row.id);
  const del=document.createElement('button');del.className='small';del.textContent='×';del.title=tr('حذف','Delete');
  del.onclick=async()=>{
   if(!confirm(tr('حذف المحادثة؟','Delete this conversation?')))return;
   if(db&&user)await db.from('conversations').delete().eq('id',row.id);
   historyRows=historyRows.filter(x=>x.id!==row.id);
   if(currentId===row.id)newChat();renderHistory();
  };
  wrap.append(b,del);box.append(wrap);
 });
}
async function refreshHistory(){
 if(!db||!user)return;
 const {data,error}=await db.from('conversations').select('id,title,updated_at').order('updated_at',{ascending:false}).limit(50);
 if(error){console.error(error);return}historyRows=data||[];renderHistory();
}
async function saveChat(){
 if(!db||!user||!currentId||!chat.length)return;
 const title=(chat.find(m=>m.role==='user')?.content||tr('محادثة جديدة','New chat')).slice(0,70);
 let r=await db.from('conversations').upsert({id:currentId,user_id:user.id,title,updated_at:new Date().toISOString()});
 if(r.error)throw r.error;
 r=await db.from('messages').delete().eq('conversation_id',currentId);
 if(r.error)throw r.error;
 const rows=chat.map((m,i)=>({conversation_id:currentId,user_id:user.id,role:m.role,content:m.content||'',image_data:m.imageData||null,position:i}));
 if(rows.length){r=await db.from('messages').insert(rows);if(r.error)throw r.error}
 await refreshHistory();
}
async function loadChat(id){
 if(!db||!user)return;
 const {data,error}=await db.from('messages').select('role,content,image_data').eq('conversation_id',id).order('position');
 if(error){alert(error.message);return}
 currentId=id;chat=(data||[]).map(m=>({role:m.role,content:m.content,imageData:m.image_data}));
 render();$('app').classList.remove('menu');
}
function newChat(){
 currentId=crypto.randomUUID();chat=[];image=null;
 $('prompt').value='';$('preview').classList.add('hidden');$('imageInput').value='';
 $('status').textContent=tr('جاهز للمساعدة','Ready to help');render();
}
function showUser(){
 $('account').textContent=user?(user.email||'Signed in'):'';
 $('logout').classList.toggle('hidden',!user);
 $('loginSide').classList.toggle('hidden',!!user);
 $('loginTop').classList.toggle('hidden',!!user);
}
async function sendMessage(){
 const text=$('prompt').value.trim();if((!text&&!image)||busy)return;
 if(!configured){alert(tr('ضع Publishable key في الكود أولًا.','Add your Supabase Publishable key first.'));return}
 if(!user){showAuth();$('authStatus').textContent=tr('سجّل الدخول أولًا لإرسال الرسائل وحفظها.','Sign in first to send and save chats.');return}
 if(!currentId)currentId=crypto.randomUUID();
 const imageData=image?.data||null;
 chat.push({role:'user',content:text,imageData});image=null;
 $('prompt').value='';$('preview').classList.add('hidden');$('imageInput').value='';
 render();busy=true;$('send').disabled=true;$('status').textContent=tr('ZAKI AI يفكر...','ZAKI AI is thinking...');
 try{
  await saveChat();
  const {data:{session}}=await db.auth.getSession();
  const response=await fetch(WORKER_URL+'/ask',{
   method:'POST',
   headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token},
   body:JSON.stringify({message:text,imageData,history:chat.slice(-13,-1).map(m=>({role:m.role==='assistant'?'model':'user',content:m.content,imageData:m.imageData||undefined}))})
  });
  const data=await response.json();
  if(!response.ok)throw new Error(data.error||data.message||('HTTP '+response.status));
  const answer=data.answer||data.response||data.candidates?.[0]?.content?.parts?.map(p=>p.text||'').join('');
  if(!answer)throw new Error('No answer from AI server');
  chat.push({role:'assistant',content:answer});
  $('status').textContent=tr('تم الرد','Answered');
 }catch(e){
  chat.push({role:'assistant',content:tr('تعذر الحصول على الرد: ','Could not get a response: ')+e.message});
  $('status').textContent=tr('تعذر الاتصال','Connection error');
 }finally{
  busy=false;$('send').disabled=false;render();
  try{await saveChat()}catch(e){$('status').textContent=tr('تعذر حفظ المحادثة: ','Could not save chat: ')+e.message}
 }
}
$('send').onclick=sendMessage;
$('prompt').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}});
$('newChat').onclick=newChat;$('menu').onclick=()=>$('app').classList.toggle('menu');
$('theme').onclick=$('themeTop').onclick=()=>{theme=theme==='dark'?'light':'dark';applyTheme()};
$('language').onclick=()=>{lang=lang==='ar'?'en':'ar';localStorage.setItem('zaki-lang',lang);applyLanguage();renderHistory();render()};
$('loginSide').onclick=$('loginTop').onclick=showAuth;$('back').onclick=showChat;
$('logout').onclick=async()=>{if(db)await db.auth.signOut();user=null;chat=[];currentId=null;showUser();renderHistory();render();showAuth()};
document.querySelectorAll('.suggestion').forEach(b=>b.onclick=()=>{$('prompt').value=b.dataset[lang];$('prompt').focus()});
$('attach').onclick=()=>$('imageInput').click();
$('imageInput').onchange=async e=>{
 const file=e.target.files?.[0];if(!file)return;
 if(file.size>5*1024*1024){alert(tr('الصورة يجب أن تكون أقل من 5 ميغابايت.','Image must be under 5 MB.'));e.target.value='';return}
 if(!['image/jpeg','image/png','image/webp'].includes(file.type)){alert('Use JPG, PNG or WebP');return}
 const data=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)});
 image={data,mime:file.type};
 $('preview').replaceChildren();const im=document.createElement('img');im.src=data;
 const name=document.createElement('span');name.textContent=file.name;
 const remove=document.createElement('button');remove.textContent='×';remove.onclick=()=>{$('preview').classList.add('hidden');image=null;$('imageInput').value=''};
 $('preview').append(im,name,remove);$('preview').classList.remove('hidden');
};
$('signIn').onclick=async()=>{
 if(!db)return $('authStatus').textContent=tr('أكمل إعداد Supabase أولًا.','Configure Supabase first.');
 const {error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});
 $('authStatus').textContent=error?.message||tr('تم تسجيل الدخول','Signed in');
};
$('signUp').onclick=async()=>{
 if(!db)return $('authStatus').textContent=tr('أكمل إعداد Supabase أولًا.','Configure Supabase first.');
 const {error}=await db.auth.signUp({email:$('email').value.trim(),password:$('password').value,options:{emailRedirectTo:location.origin+location.pathname}});
 $('authStatus').textContent=error?.message||tr('تحقق من بريدك لتأكيد الحساب.','Check your email to confirm your account.');
};
$('google').onclick=async()=>{
 if(!db)return $('authStatus').textContent=tr('أكمل إعداد Supabase أولًا.','Configure Supabase first.');
 const {error}=await db.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin+location.pathname}});
 if(error)$('authStatus').textContent=error.message;
};
applyTheme();applyLanguage();renderHistory();render();
if(!configured)$('authStatus').textContent=tr('ضع Publishable key في الكود لتفعيل الحسابات.','Add the Supabase Publishable key to enable accounts.');
if(db){
 const {data}=await db.auth.getSession();user=data.session?.user||null;showUser();
 if(user)await refreshHistory();
 db.auth.onAuthStateChange(async(_event,session)=>{
  user=session?.user||null;showUser();
  if(user){await refreshHistory();showChat()}else{historyRows=[];renderHistory()}
 });
}
</script>
</body>
</html>
