
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101114">
<title>ZAKI AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101114;color:#f5f5f7;font-family:system-ui,sans-serif}
header{height:65px;border-bottom:1px solid #303139;display:flex;align-items:center;justify-content:space-between;padding:0 18px}
.brand{font-size:22px;font-weight:800}
button,textarea{font:inherit}
button{cursor:pointer}
.login{border:1px solid #454550;background:#202127;color:white;padding:10px 14px;border-radius:12px}
main{max-width:800px;margin:auto;min-height:calc(100dvh - 65px);display:flex;flex-direction:column;padding:18px}
.welcome{text-align:center;margin:auto 0;padding:35px 0}
.logo{width:65px;height:65px;border-radius:22px;background:linear-gradient(135deg,#a78bfa,#6366f1);display:grid;place-items:center;font-size:32px;font-weight:900;margin:0 auto 18px}
h1{font-size:30px;margin:0 0 12px}
.sub{color:#aaaab5;line-height:1.8}
.suggestions{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:25px}
.suggestion{padding:13px;background:#191a20;border:1px solid #33343d;color:white;border-radius:13px}
#messages{display:flex;flex-direction:column;gap:20px;padding:15px 0}
.msg{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.9}
.user{align-self:flex-start;max-width:90%;background:#292a32;padding:12px 15px;border-radius:16px}
.ai{width:100%}
.label{color:#a78bfa;font-size:13px;margin-bottom:5px}
.composer-wrap{position:sticky;bottom:0;margin-top:auto;background:linear-gradient(transparent,#101114 15%);padding:12px 0}
.composer{background:#1b1c22;border:1px solid #454550;border-radius:19px;padding:10px}
textarea{width:100%;min-height:60px;max-height:180px;resize:vertical;background:transparent;color:white;border:0;outline:0;padding:8px}
.bottom{display:flex;align-items:center;justify-content:space-between;gap:10px}
.hint{font-size:11px;color:#999}
#send{background:#a78bfa;color:#171323;border:0;border-radius:11px;padding:10px 20px;font-weight:bold}
#send:disabled{opacity:.5}
#status{font-size:12px;color:#aaa;margin-bottom:8px}
.note{text-align:center;font-size:11px;color:#777;padding:10px}
@media(max-width:500px){.suggestions{grid-template-columns:1fr}main{padding:12px}.welcome{padding:20px 0}h1{font-size:26px}}
</style>
</head>
<body>
<header>
  <div class="brand">✦ ZAKI AI</div>
  <button class="login" id="login">تسجيل الدخول 👤</button>
</header>

<main>
  <section id="welcome" class="welcome">
    <div class="logo">Z</div>
    <h1>أهلًا بك في ZAKI AI</h1>
    <p class="sub">مساعدك الذكي متعدد اللغات.<br>اسأل ما تريد، بلا تسجيل دخول.</p>
    <div class="suggestions">
      <button class="suggestion" data-q="اشرح لي الذكاء الاصطناعي ببساطة">🧠 تعلّم شيئًا جديدًا</button>
      <button class="suggestion" data-q="ساعدني في إنشاء موقع ويب">💻 البرمجة والمواقع</button>
      <button class="suggestion" data-q="علّمني خمس كلمات إنجليزية مع الترجمة">🌍 تعلّم اللغات</button>
      <button class="suggestion" data-q="حل مسألة رياضيات واشرح الخطوات">📚 الدراسة</button>
    </div>
  </section>

  <section id="messages" aria-live="polite"></section>

  <div class="composer-wrap">
    <div id="status">جاهز للمساعدة — لا يلزم حساب</div>
    <div class="composer">
      <textarea id="prompt" placeholder="اكتب رسالتك هنا..." aria-label="رسالتك"></textarea>
      <div class="bottom">
        <span class="hint">Enter للإرسال · Shift+Enter لسطر جديد</span>
        <button id="send">إرسال ↑</button>
      </div>
    </div>
    <div class="note">قد يخطئ الذكاء الاصطناعي؛ تحقق من المعلومات المهمة.</div>
  </div>
</main>

<script>
const API_URL="https://zaki-ai.zakiply4647.workers.dev/ask";
const input=document.getElementById("prompt");
const send=document.getElementById("send");
const messages=document.getElementById("messages");
const welcome=document.getElementById("welcome");
const statusBox=document.getElementById("status");
let history=[];
let busy=false;

function render(){
  messages.replaceChildren();
  welcome.style.display=history.length?"none":"block";
  history.forEach(m=>{
    const box=document.createElement("div");
    box.className="msg "+(m.role==="user"?"user":"ai");
    if(m.role==="assistant"){
      const label=document.createElement("div");
      label.className="label";
      label.textContent="✦ ZAKI AI";
      box.appendChild(label);
    }
    const text=document.createElement("div");
    text.textContent=m.text;
    box.appendChild(text);
    messages.appendChild(box);
  });
  window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"});
}

async function ask(){
  const question=input.value.trim();
  if(!question||busy)return;
  busy=true;
  send.disabled=true;
  input.value="";
  history.push({role:"user",text:question});
  history.push({role:"assistant",text:"جارٍ التفكير..."});
  statusBox.textContent="ZAKI AI يفكر...";
  render();

  try{
    const response=await fetch(API_URL,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        message:question,
        history:history.slice(0,-2).slice(-10).map(m=>({
          role:m.role==="assistant"?"model":"user",
          parts:[{text:m.text}]
        }))
      })
    });
    const data=await response.json();
    if(!response.ok)throw new Error(data.error||"خطأ من الخادم: "+response.status);
    const answer=data.answer||data.response;
    if(!answer)throw new Error("لم تصل إجابة من الذكاء الاصطناعي.");
    history[history.length-1].text=answer;
    statusBox.textContent="تم الرد";
    try{localStorage.setItem("zaki-guest-chat",JSON.stringify(history));}catch(e){}
  }catch(error){
    history[history.length-1].text="تعذر الحصول على الرد.\n"+error.message;
    statusBox.textContent="تعذر الاتصال";
  }finally{
    busy=false;
    send.disabled=false;
    render();
  }
}

send.addEventListener("click",ask);
input.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();ask();}
});
document.querySelectorAll("[data-q]").forEach(b=>{
  b.addEventListener("click",()=>{input.value=b.dataset.q;input.focus();});
});

document.getElementById("login").addEventListener("click",()=>{
  alert("تسجيل الدخول اختياري، وسيتم إعداد صفحة الحساب لاحقًا. يمكنك استخدام المحادثة الآن بلا حساب.");
});

try{
  const saved=JSON.parse(localStorage.getItem("zaki-guest-chat")||"[]");
  if(Array.isArray(saved))history=saved;
}catch(e){}
render();
</script>
</body>
</html>
